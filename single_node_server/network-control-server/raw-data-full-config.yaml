# raw_data completion experiment config: node background load + per-task usage.
#
# Differences from server-config.yaml:
#   - no range_key_catalog (node ids are APC-*/CHQ-*/PLT-*/UGS-*, created on
#     first insert by the in-memory store)
#   - cluster-metrics carries cpu_cores + memory_gb only; raw_data has no
#     per-node network metric (bw.csv is per-edge), so network_mbps is dropped
server:
  host: "127.0.0.1"
  port: 10101
  body_limit_mb: 50
  request_log_buffer: 1000
  enable_timing: false
  timing_csv_path: "server_request_timing.csv"

api:
  enable_batch_endpoint: true
  enable_metrics_endpoint: true
  strict_mode: false
  default_batch_percents:
    - 50.0
    - 90.0

upstream:
  mode: "fallback"
  search_url_template: "http://localhost:9200/{index}/_search"
  forward_headers:
    - "x-request-id"
    - "x-request-type"

storage:
  backend: "in_memory_key_store"
  predefined_keys: []

indices:
  # Node background load from raw_data/synthetic_cpu_var.csv, keyed by node id.
  cluster-metrics:
    metrics:
      - name: "cpu_cores"
        aliases: ["cpucores", "cpu-cores"]
        storage_field: "cpu_cores"
      - name: "memory_gb"
        aliases: ["memorygb", "memory-gb"]
        storage_field: "memory_gb"
    key_fields:
      - "cluster"
    ingest_field_mapping:
      key_field: "cluster"
      epoch_field: "epoch"
      metric_fields:
        cpu_cores: "cpu_cores"
        memory_gb: "memory_gb"

  # Per-running-task usage, keyed by task id -- this is what the paper's update
  # rule refreshes ("a running task's CPU/memory estimate is set to the p50
  # quantile, unless it approaches the current allocation"). Keys are prefixed
  # with the scenario name so several scheduling trajectories can share one
  # epoch of the index without colliding.
  task-metrics:
    metrics:
      - name: "cpu_cores"
        aliases: ["cpucores", "cpu-cores"]
        storage_field: "cpu_cores"
      - name: "memory_gb"
        aliases: ["memorygb", "memory-gb"]
        storage_field: "memory_gb"
    key_fields:
      - "task_id"
    ingest_field_mapping:
      key_field: "task_id"
      epoch_field: "epoch"
      metric_fields:
        cpu_cores: "cpu_cores"
        memory_gb: "memory_gb"
